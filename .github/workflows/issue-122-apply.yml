name: Apply issue 122 movement card rules

on:
  push:
    branches:
      - agent/issue-122-movement-card-rules
    paths:
      - .github/workflows/issue-122-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-122-movement-card-rules
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply focused authoritative rules patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/src/match_session.rs")
          text = path.read_text()

          old = '''    fn start_card_play_for_side(
              &mut self,
              side: Side,
              frames: &mut Vec<RecordedReplayFrame>,
              action_index: Option<u32>,
          ) -> Result<(), MatchError> {
              if self.phase != Phase::Movement && self.phase != Phase::Attack {
                  return Err(MatchError::WrongPhase);
              }
              self.transition_to_phase(side, Phase::CardPlay, frames, action_index);
              Ok(())
          }
          '''
          new = '''    fn start_card_play_for_side(
              &mut self,
              side: Side,
              frames: &mut Vec<RecordedReplayFrame>,
              action_index: Option<u32>,
          ) -> Result<(), MatchError> {
              self.require_phase(Phase::Attack)?;
              self.transition_to_phase(side, Phase::CardPlay, frames, action_index);
              Ok(())
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("expected one StartCardPlay phase block")
          text = text.replace(old, new, 1)

          old = '''        if stack_was_empty {
              if side != self.active_side {
                  return Err(MatchError::NotActiveSide);
              }
              self.require_phase(Phase::CardPlay)?;
          } else {
          '''
          new = '''        if stack_was_empty {
              if side != self.active_side {
                  return Err(MatchError::NotActiveSide);
              }
              if self.phase != Phase::Movement && self.phase != Phase::CardPlay {
                  return Err(MatchError::WrongPhase);
              }
          } else {
          '''
          if text.count(old) != 1:
              raise SystemExit("expected one proactive card phase block")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Verify focused backend rules
        run: cargo test -p backend match_session
      - name: Check diff hygiene
        run: git diff --check
      - name: Commit verified implementation
        run: |
          rm .github/workflows/issue-122-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/match_session.rs backend/src/match_session/tests/turn_flow.rs .github/workflows/issue-122-apply.yml
          git commit -m "feat: allow movement-phase card play"
          git push origin HEAD:agent/issue-122-movement-card-rules
